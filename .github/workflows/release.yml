name: Release
# A pushed vX.Y.Z tag on main publishes a GitHub Release with the static ZIP
# and the CHANGELOG section as notes. Running it by hand from main is a dry
# run: it builds and uploads the same files as an artifact and publishes
# nothing. Tags never deploy; Vercel deploys main only. Browser tests are not
# repeated here because the tagged commit was verified on main.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Refuse a tag that is not on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check every version surface (and the tag)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run package
      - name: Stage the ZIP and release notes
        id: stage
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp test-results/artifacts/stable-desk-static.zip "stable-desk-$VERSION-static.zip"
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-${{ github.sha }}
          path: |
            stable-desk-*-static.zip
            release-notes.md
          retention-days: 7
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "stable-desk-$VERSION-static.zip"
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Stable Desk $VERSION" --notes-file release-notes.md
