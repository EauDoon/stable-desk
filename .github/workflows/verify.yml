name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One run per PR (a newer push cancels the older PR run); main runs are never
# cancelled. Each main commit gets its own group because every merge deploys
# production, and GitHub cancels a pending run when a newer one joins its
# group even with cancel-in-progress off.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    name: unit (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.13 is the engines floor in package.json; 24 is the deployed runtime.
        node: ['22.13', '24']
    steps:
      # .gitattributes pins LF, so the Windows checkout tests the same bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      # The same suite with the wall clock moved years ahead: a test that
      # reads today's date instead of tests/clock.js fails here first.
      - run: npm run test:clock
      - run: npm run check:version
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run validate
      - run: npm test
      - run: npm run check:version
      - run: npm run test:browser
      - run: npm run build
      - run: npm run package
      - run: npm run test:smoke
      - name: Record tested source and runtimes
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git rev-parse HEAD^{tree} > test-results/tree.txt
          node --version > test-results/node-version.txt
          python --version > test-results/python-version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: test-results/
          retention-days: 7
